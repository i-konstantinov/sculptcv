<div class="home flex min-h-screen flex-col">
  <header class="home__header flex items-center px-6">
    <img class="block h-20" src="sculptcv-lockup-on-dark.svg" alt="SculptCV" />
  </header>

  <main class="flex flex-1 items-center justify-center p-6">
    <section class="flex max-w-2xl flex-col items-center gap-6 text-center">
      <p-tag value="Your CV, sculpted" icon="pi pi-sparkles" [rounded]="true" />

      <h1 class="home__title">Shape a CV that<br />stands out.</h1>

      <p class="home__lead">
        SculptCV helps you build a sharp, professional CV. Start from your experience, refine every
        detail, and tailor it to each role you apply for, all in one place.
      </p>

      <p-button label="Get started" icon="pi pi-arrow-right" iconPos="right" size="large" [rounded]="true" />
    </section>
  </main>
</div>
