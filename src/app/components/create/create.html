@if (template(); as selectedTemplate) {
  <app-editor [template]="selectedTemplate" (back)="backToTemplates()" />
} @else {
  <div class="create flex flex-1 flex-col items-center justify-center gap-6 px-6 py-12 text-center">
    <i class="pi pi-exclamation-circle create__empty-icon"></i>
    @if (requestedId(); as id) {
      <p>No template found with id <strong>{{ id }}</strong>.</p>
    } @else {
      <p>No template selected.</p>
    }

    <p-button
      label="Back to templates"
      icon="pi pi-arrow-left"
      severity="secondary"
      [rounded]="true"
      routerLink="/templates"
    />
  </div>
}
